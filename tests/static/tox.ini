[tox]
envlist = yamllint, ansible-lint, cert-manager, virtualization-readiness
skipsdist = True
skip_missing_interpreters = True

[testenv:yamllint]
deps = yamllint
changedir = {toxinidir}/../..
commands = yamllint .

[testenv:ansible-lint]
deps =
  ansible-core
  ansible-lint
changedir = {toxinidir}/../..
commands =
  ansible-galaxy collection install -r {toxinidir}/collections-requirements.yml --force
  ansible-lint

# Offline regression checks: writes synthetic manifests only, no cloud/cluster IO.
[testenv:cert-manager]
deps =
  ansible-core
  PyYAML
  Jinja2
changedir = {toxinidir}/../..
commands = python -m unittest discover -s tests/unit -p test_cert_manager_azure.py -v

# Exercise HCO polling with a local API stub, including transient failures.
[testenv:virtualization-readiness]
deps =
  ansible-core
  PyYAML
changedir = {toxinidir}/../..
commands = python -m unittest discover -s tests/unit -p test_openshift_virtualization_readiness.py -v
