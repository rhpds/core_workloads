---
_ocp4_workload_authentication_cluster_account_password: "{{ ocp4_workload_authentication_cluster_account_password }}"
_ocp4_workload_authentication_cluster_account_passwords: {}
_ocp4_workload_authentication_user_accounts: []
_ocp4_workload_authentication_user_password: "{{ ocp4_workload_authentication_user_password }}"
_ocp4_workload_authentication_user_passwords: []

_ocp4_workload_authentication_admin_user:
  name: "{{ ocp4_workload_authentication_admin_username }}"
  cluster_role: cluster-admin
  password: "{{ ocp4_workload_authentication_admin_password }}"
  password_length: "{{ ocp4_workload_authentication_admin_password_length }}"
  keycloak_realm_roles:
  - admin

# Admin user is handled like other cluster users if configured to be created.
_ocp4_workload_authentication_cluster_accounts: >-
  {{
    (
      [_ocp4_workload_authentication_admin_user]
      if ocp4_workload_authentication_admin_create | bool else
      []
    ) + ocp4_workload_authentication_cluster_accounts
  }}

# Internal authentication backend and platform detection from cluster metadata.
_ocp4_workload_authentication_auth_method: ""
_aro_hosted_control_plane: false

# Internal result used to reject direct OIDC on the built-in OAuth path.
_ocp4_workload_authentication_config: {}

# Internal Keycloak CRD discovery. Prefer the served beta API and support older
# operators that advertise only the alpha API.
_ocp4_workload_authentication_keycloak_crds: {}
_ocp4_workload_authentication_keycloak_api_versions: {}
_ocp4_workload_authentication_keycloak_served_versions: []
_keycloak_crd: {}

# Internal CLI login text for clusters that use the built-in OAuth server.
_login_command: ""
