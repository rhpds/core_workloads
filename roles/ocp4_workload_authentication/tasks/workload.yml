---
- name: Detect ROSA cluster
  block:
  - name: Get cluster infrastructure info
    kubernetes.core.k8s_info:
      api_version: config.openshift.io/v1
      kind: Infrastructure
      name: cluster
    register: r_cluster_infrastructure

  - name: Set auth method based on cluster type
    vars:
      _resource_tags: >-
        {{ r_cluster_infrastructure.resources[0].status.platformStatus[
          r_cluster_infrastructure.resources[0].status.platformStatus.type | lower
        ].resourceTags | default([]) }}
      _cluster_type: >-
        {{ _resource_tags | selectattr('key', 'equalto', 'red-hat-clustertype')
          | map(attribute='value') | first | default('') }}
    ansible.builtin.set_fact:
      _ocp4_workload_authentication_auth_method: >-
        {{ 'rosa' if _cluster_type == 'rosa' else '' }}

- name: Fail if htpasswd is selected on ROSA
  when:
  - _ocp4_workload_authentication_auth_method == 'rosa'
  - ocp4_workload_authentication_provider == 'htpasswd'
  ansible.builtin.fail:
    msg: >-
      HTPasswd authentication is not supported on ROSA clusters.
      Set ocp4_workload_authentication_provider to 'keycloak'.

- name: Setup passwords
  ansible.builtin.include_tasks: setup_passwords.yml

- name: Setup htpasswd
  when: ocp4_workload_authentication_provider == 'htpasswd'
  ansible.builtin.include_tasks: setup_htpasswd.yml

- name: Setup keycloak
  when: ocp4_workload_authentication_provider == 'keycloak'
  ansible.builtin.include_tasks: setup_keycloak.yml

- name: Setup cluster role bindings
  ansible.builtin.include_tasks: setup_cluster_role_bindings.yml

- name: Remove kubeadmin user
  when:
  - ocp4_workload_authentication_remove_kubeadmin | bool
  - _ocp4_workload_authentication_auth_method != 'rosa'
  ansible.builtin.include_tasks: remove_kubeadmin_user.yml

- name: Remove ROSA cluster-admin user
  when:
  - ocp4_workload_authentication_remove_kubeadmin | bool
  - _ocp4_workload_authentication_auth_method == 'rosa'
  delegate_to: "{{ (groups['bastions'] | default(['localhost']))[0] }}"
  ansible.builtin.command: >-
    rosa delete admin
    --cluster {{ ocp4_workload_authentication_rosa_cluster_name | default('rosa-' ~ guid) }}
    --yes
  failed_when: false
  changed_when: false

# Changing the OAuth configuration restarts kube-apiserver. On SNO the API is
# briefly unavailable, so wait for the cluster operators to settle before the
# next workload touches the cluster.
- name: Wait for the API rollout to start after auth changes
  when: _ocp4_workload_authentication_auth_method != 'rosa'
  ansible.builtin.pause:
    seconds: "{{ ocp4_workload_authentication_api_wait_pause }}"

- name: Wait until kube-apiserver and authentication are settled
  when: _ocp4_workload_authentication_auth_method != 'rosa'
  kubernetes.core.k8s_info:
    api_version: config.openshift.io/v1
    kind: ClusterOperator
  register: r_ocp4_workload_authentication_clusteroperators
  vars:
    _clusteroperators: >-
      {{ r_ocp4_workload_authentication_clusteroperators.resources | default([])
         | selectattr('metadata.name', 'in', ['kube-apiserver', 'authentication'])
         | list }}
    _conditions: >-
      {{ _clusteroperators | map(attribute='status.conditions', default=[])
         | flatten | list }}
  # Retry through API errors while kube-apiserver is restarting.
  until:
  - r_ocp4_workload_authentication_clusteroperators is success
  - _clusteroperators | length == 2
  - _conditions | selectattr('type', 'equalto', 'Available')
    | selectattr('status', 'equalto', 'True') | list | length == 2
  - _conditions | selectattr('type', 'equalto', 'Progressing')
    | selectattr('status', 'equalto', 'False') | list | length == 2
  - _conditions | selectattr('type', 'equalto', 'Degraded')
    | selectattr('status', 'equalto', 'False') | list | length == 2
  retries: "{{ ocp4_workload_authentication_api_wait_retries }}"
  delay: "{{ ocp4_workload_authentication_api_wait_delay }}"

- name: Report provision data and messages
  ansible.builtin.include_tasks: report_data_and_messages.yml
