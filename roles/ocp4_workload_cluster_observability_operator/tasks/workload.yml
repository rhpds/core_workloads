---
- name: Install Cluster Observability Operator
  ansible.builtin.include_role:
    name: install_operator
  vars:
    install_operator_action: install
    install_operator_name: cluster-observability-operator
    install_operator_namespace: "{{ ocp4_workload_cluster_observability_operator_namespace }}"
    install_operator_manage_namespaces: []
    install_operator_channel: "{{ ocp4_workload_cluster_observability_operator_channel }}"
    install_operator_catalog: redhat-operators
    install_operator_automatic_install_plan_approval: >-
      {{ ocp4_workload_cluster_observability_operator_automatic_install_plan_approval | default(true) }}
    install_operator_starting_csv: "{{ ocp4_workload_cluster_observability_operator_starting_csv }}"
    install_operator_catalogsource_setup: "{{ ocp4_workload_cluster_observability_operator_use_catalog_snapshot | default(false) }}"
    install_operator_catalogsource_name: "{{ ocp4_workload_cluster_observability_operator_catalogsource_name | default('') }}"
    install_operator_catalogsource_namespace: "{{ ocp4_workload_cluster_observability_operator_namespace }}"
    install_operator_catalogsource_image: "{{ ocp4_workload_cluster_observability_operator_catalog_snapshot_image | default('') }}"
    install_operator_catalogsource_image_tag: "{{ ocp4_workload_cluster_observability_operator_catalog_snapshot_image_tag | default('') }}"

- name: Label operator namespace for cluster monitoring
  kubernetes.core.k8s:
    api_version: v1
    kind: Namespace
    name: "{{ ocp4_workload_cluster_observability_operator_namespace }}"
    state: patched
    definition:
      metadata:
        labels:
          openshift.io/cluster-monitoring: "true"

- name: Enable Monitoring UIPlugin
  when: >-
    ocp4_workload_cluster_observability_operator_enable_monitoring_uiplugin | bool
    or ocp4_workload_cluster_observability_operator_enable_perses_datasource | bool
  block:
  - name: Wait for UIPlugin CRD
    kubernetes.core.k8s_info:
      api_version: apiextensions.k8s.io/v1
      kind: CustomResourceDefinition
      name: uiplugins.observability.openshift.io
    register: r_crd_uiplugins
    retries: 200
    delay: 10
    until:
    - r_crd_uiplugins.resources is defined
    - r_crd_uiplugins.resources | list | length == 1

  - name: Create Monitoring UIPlugin
    kubernetes.core.k8s:
      state: present
      template: uiplugin.yaml.j2
    register: r_uiplugin
    until: r_uiplugin is not failed
    retries: 30
    delay: 20

- name: Create Perses global Thanos Querier datasource
  when: ocp4_workload_cluster_observability_operator_enable_perses_datasource | bool
  block:
  - name: Wait for PersesGlobalDatasource CRD
    kubernetes.core.k8s_info:
      api_version: apiextensions.k8s.io/v1
      kind: CustomResourceDefinition
      name: persesglobaldatasources.perses.dev
    register: r_crd_persesglobaldatasources
    retries: 200
    delay: 10
    until:
    - r_crd_persesglobaldatasources.resources is defined
    - r_crd_persesglobaldatasources.resources | list | length == 1

  - name: Create ServiceAccount and RBAC for Thanos Querier
    kubernetes.core.k8s:
      state: present
      template: thanos_querier_datasource_rbac.yaml.j2

  - name: Create ServiceAccount token secret
    kubernetes.core.k8s:
      state: present
      definition:
        apiVersion: v1
        kind: Secret
        metadata:
          name: thanos-querier-datasource-sa-token
          namespace: "{{ ocp4_workload_cluster_observability_operator_namespace }}"
          annotations:
            kubernetes.io/service-account.name: thanos-querier-datasource
        type: kubernetes.io/service-account-token

  - name: Wait for ServiceAccount token
    kubernetes.core.k8s_info:
      api_version: v1
      kind: Secret
      name: thanos-querier-datasource-sa-token
      namespace: "{{ ocp4_workload_cluster_observability_operator_namespace }}"
    register: r_thanos_token
    until:
    - r_thanos_token.resources | default([]) | length > 0
    - r_thanos_token.resources[0].data.token is defined
    retries: 20
    delay: 5

  - name: Create Thanos Querier datasource secret
    kubernetes.core.k8s:
      state: present
      definition:
        apiVersion: v1
        kind: Secret
        metadata:
          name: thanos-querier-datasource-secret
          namespace: "{{ ocp4_workload_cluster_observability_operator_namespace }}"
        type: Opaque
        stringData:
          authorization: "Bearer {{ r_thanos_token.resources[0].data.token | b64decode }}"

  - name: Create PersesGlobalDatasource
    kubernetes.core.k8s:
      state: present
      template: perses_global_datasource.yaml.j2
    register: r_perses_datasource
    until: r_perses_datasource is not failed
    retries: 30
    delay: 20
