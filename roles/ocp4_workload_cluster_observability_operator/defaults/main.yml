---
# Namespace for the Cluster Observability Operator (operator recommended)
ocp4_workload_cluster_observability_operator_namespace: openshift-cluster-observability-operator

# Channel to use for the Cluster Observability Operator subscription
# Cluster Observability Operator 1.5+ is available on the stable channel
ocp4_workload_cluster_observability_operator_channel: stable

# Set automatic InstallPlan approval. If set to false it is
# also suggested to set the starting_csv to pin a specific
# version. This variable has no effect when using a catalog
# snapshot (always true)
ocp4_workload_cluster_observability_operator_automatic_install_plan_approval: true

# Set a starting ClusterServiceVersion.
# Recommended to leave empty to get latest in the channel when not
# using a catalog snapshot.
# Highly recommended to be set when using a catalog snapshot but can be
# empty to get the latest available in the channel at the time when
# the catalog snapshot got created.
ocp4_workload_cluster_observability_operator_starting_csv: ""
# ocp4_workload_cluster_observability_operator_starting_csv: "cluster-observability-operator.v1.5.0"

# Create the Monitoring UIPlugin CR (observability.openshift.io/v1alpha1)
# Required for Perses dashboards in the OpenShift web console
ocp4_workload_cluster_observability_operator_enable_monitoring_uiplugin: false

# Create the PersesGlobalDatasource CR for the platform Thanos Querier
# Also creates the Monitoring UIPlugin (required) and a ServiceAccount token
# secret for Thanos Querier authentication
ocp4_workload_cluster_observability_operator_enable_perses_datasource: false

# --------------------------------
# Operator Catalog Snapshot Settings
# --------------------------------
# See https://github.com/redhat-cop/agnosticd/blob/development/docs/Operator_Catalog_Snapshots.adoc
# for instructions on how to set up catalog snapshot images

# Use a catalog snapshot
ocp4_workload_cluster_observability_operator_use_catalog_snapshot: false

# Catalog Source Name when using a catalog snapshot. This should be unique
# in the cluster to avoid clashes
ocp4_workload_cluster_observability_operator_catalogsource_name: redhat-operators-snapshot-cluster-observability

# Catalog snapshot image
ocp4_workload_cluster_observability_operator_catalog_snapshot_image: quay.io/rhpds/olm_snapshot_redhat_catalog

# Catalog snapshot image tag
ocp4_workload_cluster_observability_operator_catalog_snapshot_image_tag: "v4.22_2026_09_01"
