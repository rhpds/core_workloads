---
# AWS credentials
ocp4_workload_authentication_rosa_aws_access_key_id: ""
ocp4_workload_authentication_rosa_aws_region: ""
ocp4_workload_authentication_rosa_aws_secret_access_key: ""

# ocp4_workload_authentication_rosa_aws_access_key_id: "{{ aws_access_key_id }}"
# ocp4_workload_authentication_rosa_aws_region: "{{ aws_region }}"
# ocp4_workload_authentication_rosa_aws_secret_access_key: "{{ aws_secret_access_key }}"

# If no admin password is provided a random password will be generated
ocp4_workload_authentication_rosa_admin_create: true
ocp4_workload_authentication_rosa_admin_username: admin
ocp4_workload_authentication_rosa_admin_password: ""
ocp4_workload_authentication_rosa_admin_password_length: 16

# How many users to create
ocp4_workload_authentication_rosa_num_users: "{{ user_count | default(num_users) | default(0) | int }}"

# User base for num_users > 1.
ocp4_workload_authentication_rosa_user_basename: user

# User name for num_users == 1
ocp4_workload_authentication_rosa_user_name: "{{ ocp4_workload_authentication_rosa_user_basename }}"

# If no user password is provided a random password will be generated
ocp4_workload_authentication_rosa_user_password: ""
ocp4_workload_authentication_rosa_user_password_length: 16
# Generate a different random password for each user
ocp4_workload_authentication_rosa_user_password_randomized: true

ocp4_workload_authentication_rosa_enable_user_info_messages: true
# Only report per-user messages if number of users is greater than one
ocp4_workload_authentication_rosa_enable_user_info_data: "{{ ocp4_workload_authentication_rosa_num_users | int > 1 }}"
