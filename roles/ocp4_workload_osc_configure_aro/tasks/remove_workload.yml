---
- name: Remove KataConfig
  kubernetes.core.k8s:
    state: absent
    api_version: kataconfiguration.openshift.io/v1
    kind: KataConfig
    name: "{{ ocp4_workload_osc_configure_aro_kataconfig_name }}"

- name: Remove OSC operator
  ansible.builtin.include_role:
    name: install_operator
  vars:
    install_operator_action: remove
    install_operator_name: sandboxed-containers-operator
    install_operator_namespace: "{{ ocp4_workload_osc_configure_aro_namespace }}"

- name: Remove workload complete
  ansible.builtin.debug:
    msg: "OSC configure workload removed"
