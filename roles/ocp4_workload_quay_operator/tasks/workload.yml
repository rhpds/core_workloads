---
# Validate storage backend based on configuration
- name: Validate storage backend
  block:
  - name: Check S4 service exists
    when: ocp4_workload_quay_operator_s4_storage_enabled | bool
    kubernetes.core.k8s_info:
      api_version: v1
      kind: Service
      name: s4
      namespace: "{{ ocp4_workload_quay_operator_s4_namespace }}"
    register: r_s4_service

  - name: Assert that S4 service exists
    when: ocp4_workload_quay_operator_s4_storage_enabled | bool
    ansible.builtin.assert:
      that:
      - r_s4_service.resources | length == 1
      fail_msg: >-
        S4 storage service not found in namespace {{ ocp4_workload_quay_operator_s4_namespace }}.
        Deploy S4 first using ocp4_workload_s4 role.

  - name: Check Garage service and credentials
    when: ocp4_workload_quay_operator_garage_storage_enabled | bool
    block:
    - name: Check Garage service exists
      kubernetes.core.k8s_info:
        api_version: v1
        kind: Service
        name: garage
        namespace: "{{ ocp4_workload_quay_operator_garage_namespace }}"
      register: r_garage_service

    - name: Assert that Garage service exists
      ansible.builtin.assert:
        that:
        - r_garage_service.resources | length == 1
        fail_msg: >-
          Garage storage service not found in namespace {{ ocp4_workload_quay_operator_garage_namespace }}.
          Deploy Garage first using ocp4_workload_garage role.

    - name: Read Garage credentials Secret
      kubernetes.core.k8s_info:
        api_version: v1
        kind: Secret
        name: "{{ ocp4_workload_quay_operator_garage_credentials_secret }}"
        namespace: "{{ ocp4_workload_quay_operator_garage_namespace }}"
      register: r_garage_credentials

    - name: Assert that Garage credentials Secret exists
      ansible.builtin.assert:
        that:
        - r_garage_credentials.resources | length == 1
        fail_msg: >-
          Garage credentials secret '{{ ocp4_workload_quay_operator_garage_credentials_secret }}'
          not found in namespace {{ ocp4_workload_quay_operator_garage_namespace }}.

    - name: Set Garage credentials from Secret
      ansible.builtin.set_fact:
        _ocp4_workload_quay_operator_garage_access_key: >-
          {{ r_garage_credentials.resources[0].data.access_key | b64decode }}
        _ocp4_workload_quay_operator_garage_secret_key: >-
          {{ r_garage_credentials.resources[0].data.secret_key | b64decode }}

  - name: Check SeaweedFS service and credentials
    when: ocp4_workload_quay_operator_seaweedfs_storage_enabled | bool
    block:
    - name: Check SeaweedFS S3 service exists
      kubernetes.core.k8s_info:
        api_version: v1
        kind: Service
        name: "{{ ocp4_workload_quay_operator_seaweedfs_namespace }}-s3"
        namespace: "{{ ocp4_workload_quay_operator_seaweedfs_namespace }}"
      register: r_seaweedfs_service

    - name: Assert that SeaweedFS S3 service exists
      ansible.builtin.assert:
        that:
        - r_seaweedfs_service.resources | length == 1
        fail_msg: >-
          SeaweedFS S3 service not found in namespace {{ ocp4_workload_quay_operator_seaweedfs_namespace }}.
          Deploy SeaweedFS first using ocp4_workload_seaweedfs role.

    - name: Read SeaweedFS credentials Secret
      kubernetes.core.k8s_info:
        api_version: v1
        kind: Secret
        name: "{{ ocp4_workload_quay_operator_seaweedfs_credentials_secret }}"
        namespace: "{{ ocp4_workload_quay_operator_seaweedfs_namespace }}"
      register: r_seaweedfs_credentials

    - name: Assert that SeaweedFS credentials Secret exists
      ansible.builtin.assert:
        that:
        - r_seaweedfs_credentials.resources | length == 1
        fail_msg: >-
          SeaweedFS credentials secret '{{ ocp4_workload_quay_operator_seaweedfs_credentials_secret }}'
          not found in namespace {{ ocp4_workload_quay_operator_seaweedfs_namespace }}.

    - name: Set SeaweedFS credentials from Secret
      ansible.builtin.set_fact:
        _ocp4_workload_quay_operator_seaweedfs_access_key: >-
          {{ r_seaweedfs_credentials.resources[0].data.access_key | b64decode }}
        _ocp4_workload_quay_operator_seaweedfs_secret_key: >-
          {{ r_seaweedfs_credentials.resources[0].data.secret_key | b64decode }}

  - name: Wait for Noobaa BucketClass to exist
    when: >-
      not (ocp4_workload_quay_operator_s4_storage_enabled | bool)
      and not (ocp4_workload_quay_operator_garage_storage_enabled | bool)
      and not (ocp4_workload_quay_operator_seaweedfs_storage_enabled | bool)
    kubernetes.core.k8s_info:
      api_version: noobaa.io/v1alpha1
      kind: BucketClass
      namespace: openshift-storage
    register: r_bucket_class
    until: r_bucket_class.resources | length > 0
    retries: 120
    delay: 10
    failed_when: r_bucket_class.resources | length == 0

- name: Install Quay Operator
  when: ocp4_workload_quay_operator_install_operator | bool
  block:
  - name: Install Quay Operator
    ansible.builtin.include_role:
      name: install_operator
    vars:
      install_operator_action: install
      install_operator_name: quay-operator
      install_operator_namespace: "{{ ocp4_workload_quay_operator_namespace }}"
      install_operator_channel: "{{ ocp4_workload_quay_operator_channel }}"
      install_operator_catalog: redhat-operators
      install_operator_packagemanifest_name: "quay-operator"
      install_operator_automatic_install_plan_approval: "{{ ocp4_workload_quay_operator_automatic_install_plan_approval }}"
      install_operator_csv_nameprefix: "quay-operator"
      install_operator_starting_csv: "{{ ocp4_workload_quay_operator_starting_csv }}"
      install_operator_catalogsource_setup: "{{ ocp4_workload_quay_operator_use_catalog_snapshot }}"
      install_operator_catalogsource_name: "{{ ocp4_workload_quay_operator_catalogsource_name }}"
      install_operator_catalogsource_namespace: "{{ ocp4_workload_quay_operator_catalogsource_namespace }}"
      install_operator_catalogsource_image: "{{ ocp4_workload_quay_operator_catalog_snapshot_image | default('') }}"
      install_operator_catalogsource_image_tag: "{{ ocp4_workload_quay_operator_catalog_snapshot_image_tag }}"

- name: Install QuayRegistry
  when: ocp4_workload_quay_operator_registry_install | bool
  block:

  - name: Determine Cluster Base Domain for Quay Route
    kubernetes.core.k8s_info:
      api_version: config.openshift.io/v1
      kind: Ingress
      name: cluster
    register: r_ingress_config
    failed_when: r_ingress_config.resources | length < 1

  - name: Use provided Quay route hostname
    when: ocp4_workload_quay_operator_registry_route | default("") | length > 0
    ansible.builtin.set_fact:
      _ocp4_workload_quay_operator_registry_route: "{{ ocp4_workload_quay_operator_registry_route }}"

  - name: Otherwise use default for the Quay route hostname
    when: ocp4_workload_quay_operator_registry_route | default("") | length == 0
    ansible.builtin.set_fact:
      _ocp4_workload_quay_operator_registry_route: "{{ ocp4_workload_quay_operator_registry_hostname }}.{{ openshift_cluster_ingress_domain }}"

  - name: Create Quay Registry Resources
    kubernetes.core.k8s:
      state: present
      definition: "{{ lookup('template', item) | from_yaml }}"
    loop:
    - quay_namespace.yaml.j2
    - config_bundle_secret.yaml.j2
    - quay_registry.yaml.j2

  - name: Wait for Quay app deployment to exist
    when: ocp4_workload_quay_operator_registry_startup_probe_update | default(false) | bool
    kubernetes.core.k8s_info:
      api_version: apps/v1
      kind: Deployment
      namespace: "{{ ocp4_workload_quay_operator_registry_namespace }}"
      label_selectors:
      - quay-component=quay
    register: r_quay_app_deployment
    until: r_quay_app_deployment.resources | length > 0
    retries: 30
    delay: 10

  - name: Increase Quay startup probe threshold
    when:
    - ocp4_workload_quay_operator_registry_startup_probe_update | default(false) | bool
    - r_quay_app_deployment.resources | default([]) | length > 0
    kubernetes.core.k8s:
      api_version: apps/v1
      kind: Deployment
      name: "{{ r_quay_app_deployment.resources[0].metadata.name }}"
      namespace: "{{ ocp4_workload_quay_operator_registry_namespace }}"
      state: patched
      definition:
        spec:
          template:
            spec:
              containers:
              - name: quay-app
                startupProbe:
                  failureThreshold: "{{ ocp4_workload_quay_operator_registry_startup_probe_failure_threshold }}"
    failed_when: false

  - name: Wait for Quay Registry to be available
    kubernetes.core.k8s_info:
      api_version: quay.redhat.com/v1
      kind: QuayRegistry
      name: "{{ ocp4_workload_quay_operator_registry_name }}"
      namespace: "{{ ocp4_workload_quay_operator_registry_namespace }}"
    register: r_quay_registry
    until:
    - r_quay_registry.resources[0].status.currentVersion is defined
    - r_quay_registry.resources[0].status.currentVersion | length > 0
    retries: 120
    delay: 10

  - name: Configure QuayAdmin User
    when: ocp4_workload_quay_operator_registry_configure_admin | bool
    block:
    - name: Wait for Quay API to be available
      ansible.builtin.uri:
        url: "{{ r_quay_registry.resources[0].status.registryEndpoint }}/api/v1/discovery"
        method: GET
        validate_certs: false
      register: r_quayapi
      until: r_quayapi.status == 200 or r_quayapi.status == 403
      retries: 120
      delay: 10

    - name: Set provided admin password
      when: ocp4_workload_quay_operator_registry_admin_password | default("") | length > 0
      ansible.builtin.set_fact:
        _ocp4_workload_quay_operator_registry_admin_password: >-
          {{ ocp4_workload_quay_operator_registry_admin_password }}

    - name: Generate quayadmin password
      when: ocp4_workload_quay_operator_registry_admin_password | default("") | length == 0
      ansible.builtin.set_fact:
        _ocp4_workload_quay_operator_registry_admin_password: >-
          {{ lookup('password', '/dev/null length={{
            ocp4_workload_quay_operator_registry_admin_password_length | default(20)
            }} chars=ascii_letters,digits') }}

    - name: Create QuayAdmin user
      ansible.builtin.uri:
        url: "{{ r_quay_registry.resources[0].status.registryEndpoint }}/api/v1/user/initialize"
        method: POST
        body:
          username: "{{ ocp4_workload_quay_operator_registry_admin_user }}"
          password: "{{ _ocp4_workload_quay_operator_registry_admin_password }}"
          email: "quayadmin@demo.redhat.com"
          access_token: "true"
        body_format: json
        validate_certs: false
        status_code: 200
      register: r_quayadmin
      until: r_quayadmin is not failed
      retries: 120
      delay: 10

    - name: Extend Quay admin token expiration
      when: ocp4_workload_quay_operator_registry_extend_token_expiration | bool
      ignore_errors: true
      block:
      - name: Get Quay database pod and ensure it's running
        kubernetes.core.k8s_info:
          api_version: v1
          kind: Pod
          namespace: "{{ ocp4_workload_quay_operator_registry_namespace }}"
          label_selectors:
          - quay-component=postgres
        register: r_quay_database_pod
        retries: 40
        delay: 5
        until:
        - r_quay_database_pod.resources is defined
        - r_quay_database_pod.resources | length == 1
        - r_quay_database_pod.resources[0].status is defined
        - r_quay_database_pod.resources[0].status.phase is defined
        - r_quay_database_pod.resources[0].status.phase == "Running"

      - name: Extend Quay token expiration
        kubernetes.core.k8s_exec:
          namespace: "{{ ocp4_workload_quay_operator_registry_namespace }}"
          pod: "{{ r_quay_database_pod.resources[0].metadata.name }}"
          command: psql -d quay-quay-database -c "update public.oauthaccesstoken set expires_at = '2300-12-31 00:00:00' where id = 1;"
        register: r_extend_quay_token_expiration
        until: r_extend_quay_token_expiration.rc == 0
        retries: 5
        delay: 30

    - name: Save access_token
      when: r_quayadmin.status == 200
      ansible.builtin.set_fact:
        _ocp4_workload_quay_operator_registry_admin_token: "{{ r_quayadmin.json.access_token }}"

    - name: Create quay admin token secret
      kubernetes.core.k8s:
        state: present
        definition: "{{ lookup('template', 'quay-admin-token-secret.yml.j2') | from_yaml }}"

    - name: Create quay admin credentials secret
      when: ocp4_workload_quay_operator_registry_save_admin_credentials | bool
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: v1
          kind: Secret
          metadata:
            name: "{{ ocp4_workload_quay_operator_registry_admin_credentials_secret }}"
            namespace: "{{ ocp4_workload_quay_operator_registry_namespace }}"
          type: Opaque
          stringData:
            username: "{{ ocp4_workload_quay_operator_registry_admin_user }}"
            password: "{{ _ocp4_workload_quay_operator_registry_admin_password }}"

  - name: Save user data for Quay console URL
    agnosticd.core.agnosticd_user_info:
      msg: "Red Hat Quay is available at {{ r_quay_registry.resources[0].status.registryEndpoint }}"
      data:
        quay_console_url: "{{ r_quay_registry.resources[0].status.registryEndpoint }}"
        quay_host: "{{ r_quay_registry.resources[0].status.registryEndpoint | urlsplit('hostname') }}"

  - name: Save user data for Quay admin user
    when: ocp4_workload_quay_operator_registry_configure_admin | bool
    agnosticd.core.agnosticd_user_info:
      msg: >-
        "A Quay Super User '{{ ocp4_workload_quay_operator_registry_admin_user }}' has been created."
        "The super user password is {{ _ocp4_workload_quay_operator_registry_admin_password }}".
        "The token for the super user is {{ _ocp4_workload_quay_operator_registry_admin_token }}".
      data:
        quay_admin_username: "{{ ocp4_workload_quay_operator_registry_admin_user }}"
        quay_admin_password: "{{ _ocp4_workload_quay_operator_registry_admin_password }}"
        quay_admin_token: "{{ _ocp4_workload_quay_operator_registry_admin_token }}"

  # Only for old versions of Quay. Newer versions don't have a config editor anymore
  - name: Get and save Quay config editor credentials secret
    when: r_quay_registry.resources[0].status.configEditorCredentialsSecret | default("") | length > 0
    block:
    - name: Get Quay config editor credentials secret
      kubernetes.core.k8s_info:
        api_version: v1
        kind: Secret
        name: "{{ r_quay_registry.resources[0].status.configEditorCredentialsSecret }}"
        namespace: "{{ ocp4_workload_quay_operator_registry_namespace }}"
      register: r_config_editor_secret

    - name: Save user data for Quay config editor
      agnosticd.core.agnosticd_user_info:
        msg: >-
          "Red Hat Quay Config is available at {{ r_quay_registry.resources[0].status.configEditorEndpoint }}."
          "- Config User: quayconfig."
          "- Config Password: {{ r_config_editor_secret.resources[0].data.password | b64decode }}."
        data:
          quay_config_url: "{{ r_quay_registry.resources[0].status.configEditorEndpoint }}"
          quay_config_username: "quayconfig"
          quay_config_password: "{{ r_config_editor_secret.resources[0].data.password | b64decode }}"
