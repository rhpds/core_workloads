---
# KubeVirt's validating webhook refuses the uninstall while any workload is
# still running:
#
#   admission webhook "kubevirt-validator.kubevirt.io" denied the request:
#   Rejecting the uninstall request, since there are still Virtual Machine
#   Instances present. Either delete all KubeVirt related workloads or change
#   the uninstall strategy before uninstalling KubeVirt.
#
# Take the first option and clear the workloads first. VirtualMachines go
# before VirtualMachineInstances, since a running VM owns its VMI and would
# simply recreate one.
#
# None of these CRDs can be assumed registered. Deleting the HyperConverged
# takes its operands with it, so SSP in particular is already gone by the time
# we reach it, and the API versions move between CNV releases. An unknown
# resource type is a hard error for kubernetes.core.k8s rather than nothing to
# delete, so look each CRD up and take the version from the cluster.

- name: Initialize the KubeVirt CRD map
  ansible.builtin.set_fact:
    _kubevirt_crds: {}

- name: Look up the KubeVirt CRDs
  kubernetes.core.k8s_info:
    api_version: apiextensions.k8s.io/v1
    kind: CustomResourceDefinition
    name: "{{ item }}"
  loop:
  - virtualmachines.kubevirt.io
  - virtualmachineinstances.kubevirt.io
  - ssps.ssp.kubevirt.io
  - kubevirts.kubevirt.io
  register: r_kubevirt_crds

- name: Record which KubeVirt CRDs are registered and at which version
  ansible.builtin.set_fact:
    _kubevirt_crds: >-
      {{ _kubevirt_crds | combine({
           item.resources[0].metadata.name:
             item.resources[0].spec.group ~ '/' ~
             (item.resources[0].spec.versions | selectattr('storage') | map(attribute='name') | first)
         }) }}
  loop: "{{ r_kubevirt_crds.results | selectattr('resources') | list }}"
  loop_control:
    label: "{{ item.item }}"

- name: Delete all VirtualMachines
  when: "'virtualmachines.kubevirt.io' in _kubevirt_crds"
  block:
  - name: Find all VirtualMachines
    kubernetes.core.k8s_info:
      api_version: "{{ _kubevirt_crds['virtualmachines.kubevirt.io'] }}"
      kind: VirtualMachine
    register: r_virtualmachines

  - name: Remove all VirtualMachines
    kubernetes.core.k8s:
      state: absent
      api_version: "{{ _kubevirt_crds['virtualmachines.kubevirt.io'] }}"
      kind: VirtualMachine
      name: "{{ item.metadata.name }}"
      namespace: "{{ item.metadata.namespace }}"
      wait: true
      wait_timeout: 300
    loop: "{{ r_virtualmachines.resources }}"
    loop_control:
      label: "{{ item.metadata.namespace }}/{{ item.metadata.name }}"

- name: Delete any remaining VirtualMachineInstances
  when: "'virtualmachineinstances.kubevirt.io' in _kubevirt_crds"
  block:
  - name: Find remaining VirtualMachineInstances
    kubernetes.core.k8s_info:
      api_version: "{{ _kubevirt_crds['virtualmachineinstances.kubevirt.io'] }}"
      kind: VirtualMachineInstance
    register: r_virtualmachineinstances

  - name: Remove remaining VirtualMachineInstances
    kubernetes.core.k8s:
      state: absent
      api_version: "{{ _kubevirt_crds['virtualmachineinstances.kubevirt.io'] }}"
      kind: VirtualMachineInstance
      name: "{{ item.metadata.name }}"
      namespace: "{{ item.metadata.namespace }}"
      wait: true
      wait_timeout: 300
    loop: "{{ r_virtualmachineinstances.resources }}"
    loop_control:
      label: "{{ item.metadata.namespace }}/{{ item.metadata.name }}"

  - name: Wait until no VirtualMachineInstances remain
    kubernetes.core.k8s_info:
      api_version: "{{ _kubevirt_crds['virtualmachineinstances.kubevirt.io'] }}"
      kind: VirtualMachineInstance
    register: r_virtualmachineinstances
    retries: 30
    delay: 10
    until: r_virtualmachineinstances.resources | length == 0
    ignore_errors: true

  # A VMI still here after five minutes is not leaving on its own. It is
  # holding the kubevirt.io/virtualMachineControllerFinalize finalizer and
  # whatever was meant to clear it - virt-handler, or the virt-launcher pod it
  # watches - is already gone or wedged, so the object sits in Terminating and
  # keeps the validating webhook blocking the uninstall indefinitely.
  #
  # Destroy has no state worth preserving and the whole operator comes down a
  # few tasks from now, so stop being polite: drop the grace period, then clear
  # the finalizers so the API server can reap the object with nobody to ack it.
  - name: Force out VirtualMachineInstances that would not terminate
    when: r_virtualmachineinstances.resources | default([]) | length > 0
    vars:
      _vmi_api: "{{ _kubevirt_crds['virtualmachineinstances.kubevirt.io'] }}"
    block:
    - name: Report the VirtualMachineInstances being forced out
      ansible.builtin.debug:
        msg: >-
          {{ item.metadata.namespace }}/{{ item.metadata.name }} stuck in
          {{ item.status.phase | default('unknown') }} with finalizers
          {{ item.metadata.finalizers | default([]) | join(',') | default('none', true) }}
      loop: "{{ r_virtualmachineinstances.resources }}"
      loop_control:
        label: "{{ item.metadata.namespace }}/{{ item.metadata.name }}"

    - name: Delete stuck VirtualMachineInstances with no grace period
      kubernetes.core.k8s:
        state: absent
        api_version: "{{ _vmi_api }}"
        kind: VirtualMachineInstance
        name: "{{ item.metadata.name }}"
        namespace: "{{ item.metadata.namespace }}"
        delete_options:
          gracePeriodSeconds: 0
      loop: "{{ r_virtualmachineinstances.resources }}"
      loop_control:
        label: "{{ item.metadata.namespace }}/{{ item.metadata.name }}"
      failed_when: false

    # Patching an object that the previous task finally managed to reap is a
    # 404, not a problem, hence failed_when: false here too.
    - name: Strip finalizers from stuck VirtualMachineInstances
      kubernetes.core.k8s:
        state: patched
        merge_type: merge
        api_version: "{{ _vmi_api }}"
        kind: VirtualMachineInstance
        name: "{{ item.metadata.name }}"
        namespace: "{{ item.metadata.namespace }}"
        definition:
          metadata:
            finalizers: []
      loop: "{{ r_virtualmachineinstances.resources }}"
      loop_control:
        label: "{{ item.metadata.namespace }}/{{ item.metadata.name }}"
      failed_when: false

    - name: Confirm the forced VirtualMachineInstances are gone
      kubernetes.core.k8s_info:
        api_version: "{{ _vmi_api }}"
        kind: VirtualMachineInstance
      register: r_forced_virtualmachineinstances
      retries: 12
      delay: 5
      until: r_forced_virtualmachineinstances.resources | length == 0

- name: Delete HyperConverged
  kubernetes.core.k8s:
    state: absent
    api_version: hco.kubevirt.io/v1beta1
    kind: HyperConverged
    name: kubevirt-hyperconverged
    namespace: openshift-cnv

- name: Delete SSP
  when: _crd in _kubevirt_crds
  vars:
    _crd: ssps.ssp.kubevirt.io
  kubernetes.core.k8s:
    state: absent
    api_version: "{{ _kubevirt_crds[_crd] }}"
    kind: SSP
    name: ssp-kubevirt-hyperconverged
    namespace: openshift-cnv

- name: Delete Kubevirt
  when: _crd in _kubevirt_crds
  vars:
    _crd: kubevirts.kubevirt.io
  kubernetes.core.k8s:
    state: absent
    api_version: "{{ _kubevirt_crds[_crd] }}"
    kind: KubeVirt
    name: kubevirt-kubevirt-hyperconverged
    namespace: openshift-cnv

- name: Wait 10 seconds for things to disappear
  ansible.builtin.pause:
    seconds: 10

- name: Remove OpenShift Virtualization Operator
  ansible.builtin.include_role:
    name: install_operator
  vars:
    install_operator_action: remove
    install_operator_name: kubevirt-hyperconverged
    install_operator_namespace: openshift-cnv
    install_operator_manage_namespaces:
    - openshift-cnv
    install_operator_channel: "{{ ocp4_workload_openshift_virtualization_channel }}"
    install_operator_catalog: redhat-operators
    install_operator_automatic_install_plan_approval: "{{ ocp4_workload_openshift_virtualization_automatic_install_plan_approval | default(true) }}"
    install_operator_starting_csv: "{{ ocp4_workload_openshift_virtualization_starting_csv }}"
    install_operator_catalogsource_setup: "{{ ocp4_workload_openshift_virtualization_use_catalog_snapshot | default(false) }}"
    install_operator_catalogsource_name: "{{ ocp4_workload_openshift_virtualization_catalogsource_name | default('') }}"
    install_operator_catalogsource_namespace: openshift-cnv
    install_operator_catalogsource_image: "{{ ocp4_workload_openshift_virtualization_catalog_snapshot_image | default('') }}"
    install_operator_catalogsource_image_tag: "{{ ocp4_workload_openshift_virtualization_catalog_snapshot_image_tag | default('') }}"
