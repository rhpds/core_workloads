---
# KubeVirt's validating webhook refuses the uninstall while any workload is
# still running:
#
#   admission webhook "kubevirt-validator.kubevirt.io" denied the request:
#   Rejecting the uninstall request, since there are still Virtual Machine
#   Instances present. Either delete all KubeVirt related workloads or change
#   the uninstall strategy before uninstalling KubeVirt.
#
# Take the first option and clear the workloads first. VirtualMachines go
# before VirtualMachineInstances, since a running VM owns its VMI and would
# simply recreate one. The CRDs are gone once the operator has been removed,
# so a second destroy run must not assume they are registered.

- name: Look up the KubeVirt workload CRDs
  kubernetes.core.k8s_info:
    api_version: apiextensions.k8s.io/v1
    kind: CustomResourceDefinition
    name: "{{ item }}"
  loop:
  - virtualmachines.kubevirt.io
  - virtualmachineinstances.kubevirt.io
  register: r_kubevirt_crds

- name: Record which KubeVirt workload CRDs are registered
  ansible.builtin.set_fact:
    _kubevirt_crds: >-
      {{ r_kubevirt_crds.results | selectattr('resources') | map(attribute='item') | list }}

- name: Delete all VirtualMachines
  when: "'virtualmachines.kubevirt.io' in _kubevirt_crds"
  block:
  - name: Find all VirtualMachines
    kubernetes.core.k8s_info:
      api_version: kubevirt.io/v1
      kind: VirtualMachine
    register: r_virtualmachines

  - name: Remove all VirtualMachines
    kubernetes.core.k8s:
      state: absent
      api_version: kubevirt.io/v1
      kind: VirtualMachine
      name: "{{ item.metadata.name }}"
      namespace: "{{ item.metadata.namespace }}"
      wait: true
      wait_timeout: 300
    loop: "{{ r_virtualmachines.resources }}"
    loop_control:
      label: "{{ item.metadata.namespace }}/{{ item.metadata.name }}"

- name: Delete any remaining VirtualMachineInstances
  when: "'virtualmachineinstances.kubevirt.io' in _kubevirt_crds"
  block:
  - name: Find remaining VirtualMachineInstances
    kubernetes.core.k8s_info:
      api_version: kubevirt.io/v1
      kind: VirtualMachineInstance
    register: r_virtualmachineinstances

  - name: Remove remaining VirtualMachineInstances
    kubernetes.core.k8s:
      state: absent
      api_version: kubevirt.io/v1
      kind: VirtualMachineInstance
      name: "{{ item.metadata.name }}"
      namespace: "{{ item.metadata.namespace }}"
      wait: true
      wait_timeout: 300
    loop: "{{ r_virtualmachineinstances.resources }}"
    loop_control:
      label: "{{ item.metadata.namespace }}/{{ item.metadata.name }}"

  - name: Wait until no VirtualMachineInstances remain
    kubernetes.core.k8s_info:
      api_version: kubevirt.io/v1
      kind: VirtualMachineInstance
    register: r_virtualmachineinstances
    retries: 30
    delay: 10
    until: r_virtualmachineinstances.resources | length == 0

- name: Delete HyperConverged
  kubernetes.core.k8s:
    state: absent
    api_version: hco.kubevirt.io/v1beta1
    kind: HyperConverged
    name: kubevirt-hyperconverged
    namespace: openshift-cnv

- name: Delete SSP
  kubernetes.core.k8s:
    state: absent
    api_version: ssp.kubevirt.io/v1beta1
    kind: SSP
    name: ssp-kubevirt-hyperconverged
    namespace: openshift-cnv

- name: Delete Kubevirt
  kubernetes.core.k8s:
    state: absent
    api_version: kubevirt.io/v1
    kind: KubeVirt
    name: kubevirt-kubevirt-hyperconverged
    namespace: openshift-cnv

- name: Wait 10 seconds for things to disappear
  ansible.builtin.pause:
    seconds: 10

- name: Remove OpenShift Virtualization Operator
  ansible.builtin.include_role:
    name: install_operator
  vars:
    install_operator_action: remove
    install_operator_name: kubevirt-hyperconverged
    install_operator_namespace: openshift-cnv
    install_operator_manage_namespaces:
    - openshift-cnv
    install_operator_channel: "{{ ocp4_workload_openshift_virtualization_channel }}"
    install_operator_catalog: redhat-operators
    install_operator_automatic_install_plan_approval: "{{ ocp4_workload_openshift_virtualization_automatic_install_plan_approval | default(true) }}"
    install_operator_starting_csv: "{{ ocp4_workload_openshift_virtualization_starting_csv }}"
    install_operator_catalogsource_setup: "{{ ocp4_workload_openshift_virtualization_use_catalog_snapshot | default(false) }}"
    install_operator_catalogsource_name: "{{ ocp4_workload_openshift_virtualization_catalogsource_name | default('') }}"
    install_operator_catalogsource_namespace: openshift-cnv
    install_operator_catalogsource_image: "{{ ocp4_workload_openshift_virtualization_catalog_snapshot_image | default('') }}"
    install_operator_catalogsource_image_tag: "{{ ocp4_workload_openshift_virtualization_catalog_snapshot_image_tag | default('') }}"
