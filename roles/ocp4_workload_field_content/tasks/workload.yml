---
# URL set → BYO Application (existing path). URL empty → community catalog ApplicationSet.
- name: Determine field content GitOps mode
  ansible.builtin.set_fact:
    _ocp4_workload_field_content_byo: "{{ (ocp4_workload_field_content_gitops_repo_url | default('') | string | trim | length) > 0 }}"

# ===================================================================
# Check for LiteMaaS credentials (optional - passed from AgnosticV)
# ===================================================================
- name: Check LiteMaaS credentials
  when: ocp4_workload_field_content_litemaas_api_url != "" and ocp4_workload_field_content_litemaas_api_key != ""
  block:
    - name: Set LiteMaaS credentials
      ansible.builtin.set_fact:
        _litemaas_api_url: "{{ ocp4_workload_field_content_litemaas_api_url }}"
        _litemaas_api_key: "{{ ocp4_workload_field_content_litemaas_api_key }}"
        _litemaas_model: "{{ ocp4_workload_field_content_litemaas_model }}"
        _litemaas_available: true

    - name: Debug LiteMaaS credentials status
      ansible.builtin.debug:
        msg: |
          LiteMaaS credentials available: true
          API URL: {{ _litemaas_api_url }}
          Model: {{ _litemaas_model }}

- name: Set LiteMaaS unavailable
  when: ocp4_workload_field_content_litemaas_api_url == "" or ocp4_workload_field_content_litemaas_api_key == ""
  ansible.builtin.set_fact:
    _litemaas_available: false

# ===================================================================
# Register private repo credentials with ArgoCD (if key provided)
# ===================================================================
- name: Create ArgoCD repository secret for private repo
  kubernetes.core.k8s:
    state: present
    template: repository-secret.yaml.j2
  when:
  - _ocp4_workload_field_content_byo | bool
  - ocp4_workload_field_content_gitops_repo_key | default('') | length > 0

# ===================================================================
# Build Helm values
# ===================================================================
- name: Set deployer values (always included)
  ansible.builtin.set_fact:
    _ocp4_workload_field_content_deployer_values:
      deployer:
        domain: "{{ openshift_cluster_ingress_domain }}"
        apiUrl: "{{ openshift_api_url }}"

# BYO only. Catalog charts already declare gitops.repoUrl in their own values.yaml.
- name: Add BYO gitops values
  when: _ocp4_workload_field_content_byo | bool
  ansible.builtin.set_fact:
    _ocp4_workload_field_content_deployer_values: >-
      {{
        _ocp4_workload_field_content_deployer_values | combine({
          'gitops': {
            'repoURL': ocp4_workload_field_content_gitops_repo_url,
            'revision': ocp4_workload_field_content_gitops_repo_revision,
            'path': ocp4_workload_field_content_gitops_repo_path
          }
        })
      }}

- name: Add LiteMaaS credentials to Helm values (if available)
  ansible.builtin.set_fact:
    _ocp4_workload_field_content_litemaas_values:
      litemaas:
        enabled: true
        apiUrl: "{{ _litemaas_api_url }}"
        apiKey: "{{ _litemaas_api_key }}"
        model: "{{ _litemaas_model }}"
  when: _litemaas_available | bool

- name: Set empty LiteMaaS values (if not available)
  ansible.builtin.set_fact:
    _ocp4_workload_field_content_litemaas_values:
      litemaas:
        enabled: false
  when: not (_litemaas_available | bool)

- name: Built list of user
  ansible.builtin.set_fact:
    # Set password in list to provided password generated value if not set.
    _ocp4_workload_field_content_multi_user_usernames: >-
      {{
        (_ocp4_workload_field_content_multi_user_usernames | default([])) + [{"username": "user" ~ _n}]
      }}
  loop: "{{ range(1, num_users | int + 1) | list }}"
  loop_control:
    loop_var: _n
  when: (create_multi_user | bool) | default(false)

- name: Add multi_user informations to Helm values (if available)
  ansible.builtin.set_fact:
    _ocp4_workload_field_content_multi_user_values:
      multi_user:
        num_users: "{{ num_users | default(1) }}"
        users: "{{ _ocp4_workload_field_content_multi_user_usernames | default([]) }}"
  when: (create_multi_user | bool) | default(false)

- name: Combine all Helm values
  ansible.builtin.set_fact:
    _ocp4_workload_field_content_all_values: >-
      {{
        ocp4_workload_field_content_helm_values | default({})
        | combine(_ocp4_workload_field_content_deployer_values)
        | combine(_ocp4_workload_field_content_litemaas_values)
        | combine(_ocp4_workload_field_content_multi_user_values | default({}))
      }}

- name: Debug final Helm values
  ansible.builtin.debug:
    msg: "{{ _ocp4_workload_field_content_all_values | to_yaml }}"

# ===================================================================
# Deploy via ArgoCD
# ===================================================================
- name: Create field content ArgoCD application
  when: _ocp4_workload_field_content_byo | bool
  kubernetes.core.k8s:
    state: present
    template: application.yaml.j2

- name: Verify ArgoCD application was accepted
  when: _ocp4_workload_field_content_byo | bool
  kubernetes.core.k8s_info:
    api_version: argoproj.io/v1alpha1
    kind: Application
    name: field-content
    namespace: "{{ ocp4_workload_field_content_namespace }}"
  register: argocd_field_content
  retries: 6
  delay: 10
  until:
    - argocd_field_content.resources | length > 0
  failed_when: argocd_field_content.resources | length == 0

- name: Create field content catalog ApplicationSet
  when: not (_ocp4_workload_field_content_byo | bool)
  kubernetes.core.k8s:
    state: present
    template: applicationset.yaml.j2

- name: Verify catalog ApplicationSet was accepted
  when: not (_ocp4_workload_field_content_byo | bool)
  kubernetes.core.k8s_info:
    api_version: argoproj.io/v1alpha1
    kind: ApplicationSet
    name: "{{ ocp4_workload_field_content_catalog_applicationset_name }}"
    namespace: "{{ ocp4_workload_field_content_namespace }}"
  register: argocd_field_content_catalog
  retries: 6
  delay: 10
  until:
    - argocd_field_content_catalog.resources | length > 0
  failed_when: argocd_field_content_catalog.resources | length == 0
