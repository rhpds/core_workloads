---
# =============================================================================
# Field Content Workload - Variable Defaults
# =============================================================================
# Two exclusive modes, chosen by whether a GitOps URL is set:
#
# - URL empty (default): ApplicationSet over the community catalog
#   (catalog/tested/*.yaml). Generated Applications are not auto-synced.
# - URL set: one Application pointing at that repo (existing BYO path).
#
# Automatically injected values available in your Helm chart:
#   deployer.domain  - Cluster ingress domain (e.g., apps.cluster.example.com)
#   deployer.apiUrl  - Cluster API URL (e.g., https://api.cluster.example.com:6443)
#   argocd.project   - AppProject for child Applications (default: deployed)
# =============================================================================

# -----------------------------------------------------------------------------
# BYO GitOps repository URL
# -----------------------------------------------------------------------------
# Empty → community catalog ApplicationSet.
# Set → create Application field-content against this URL (unchanged).
ocp4_workload_field_content_gitops_repo_url: ""

# -----------------------------------------------------------------------------
# Optional: GitHub PAT or access token for private repositories
# -----------------------------------------------------------------------------
# When provided, creates an ArgoCD repository secret so it can clone the repo.
# For GitHub: use a Personal Access Token (PAT) with repo scope.
# For GitLab: use a Project Access Token or PAT with read_repository scope.
# Leave empty for public repositories.
ocp4_workload_field_content_gitops_repo_key: ""

# -----------------------------------------------------------------------------
# Optional: Git revision and path
# -----------------------------------------------------------------------------
# Git branch, tag, or commit to deploy
ocp4_workload_field_content_gitops_repo_revision: main

# Path within the repository (empty = root of repo)
ocp4_workload_field_content_gitops_repo_path: ""

# -----------------------------------------------------------------------------
# Optional: ArgoCD configuration
# -----------------------------------------------------------------------------
# Namespace where the ArgoCD Application will be created
ocp4_workload_field_content_namespace: openshift-gitops

# Additional Helm values merged with auto-injected deployer values
# Example:
#   ocp4_workload_field_content_helm_values:
#     myApp:
#       replicas: 3
ocp4_workload_field_content_helm_values: {}

# -----------------------------------------------------------------------------
# Community catalog (used when gitops_repo_url is empty)
# -----------------------------------------------------------------------------
ocp4_workload_field_content_catalog_repo_url: https://github.com/rhpds/field-sourced-content-template.git
ocp4_workload_field_content_catalog_repo_revision: main
ocp4_workload_field_content_catalog_files_path: catalog/tested/*.yaml
ocp4_workload_field_content_catalog_applicationset_name: field-content-catalog

# AppProject for child Applications after a catalog (or BYO) demo is synced.
# Catalog tiles and the BYO parent Application stay in `default`.
ocp4_workload_field_content_deployed_project: deployed

# -----------------------------------------------------------------------------
# Optional: LiteMaaS/MaaS credentials
# -----------------------------------------------------------------------------
# Passed from AgnosticV when ocp4_workload_litellm_virtual_keys provisions
# a virtual key. These are read from agnosticd_user_data in the catalog.
#
# When both api_url and api_key are provided, the role injects:
#   litemaas:
#     enabled: true
#     apiUrl: <api_url>
#     apiKey: <api_key>
#     model: <model>
# into the Helm values for the ArgoCD Application.
ocp4_workload_field_content_litemaas_api_url: ""
ocp4_workload_field_content_litemaas_api_key: ""
ocp4_workload_field_content_litemaas_model: "llama-scout-17b"

# -----------------------------------------------------------------------------
# Deployment behavior
# -----------------------------------------------------------------------------
# This role uses a "fire and forget" approach:
#   - Creates the ArgoCD Application (BYO) or ApplicationSet (catalog)
#   - Verifies it was accepted by the cluster (~1 min max)
#   - Does NOT wait for sync or health status
#
# Developers are responsible for monitoring their deployment in ArgoCD/OpenShift.
